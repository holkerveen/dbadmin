<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>dbadmin</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; display: flex; height: 100vh; font: 14px/1.4 system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
  #sidebar { width: 200px; overflow-y: auto; border-right: 1px solid #444; padding: 8px; box-sizing: border-box; }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; color: #888; margin: 4px 0 8px; }
  #sidebar ul { list-style: none; margin: 0; padding: 0; }
  #sidebar li { padding: 6px 8px; cursor: pointer; border-radius: 4px; }
  #sidebar li:hover, #sidebar li.active { background: #333; }
  #main { flex: 1; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; overflow: hidden; }
  #sqlBox { display: flex; gap: 8px; margin-bottom: 8px; }
  textarea { flex: 1; height: 60px; background: #111; color: #ddd; border: 1px solid #444; padding: 6px; font-family: monospace; }
  button { padding: 0 16px; background: #2d6cdf; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  #status { color: #f77; margin-bottom: 8px; white-space: pre-wrap; }
  #resultWrap { flex: 1; overflow: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #444; padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { background: #2a2a2a; position: sticky; top: 0; }
  #pager { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  #pager a { padding: 4px 16px; background: #2d6cdf; color: #fff; border-radius: 4px; text-decoration: none; }
  #sidebar li a { color: inherit; text-decoration: none; display: block; }
  #result td a { color: #6ea8ff; }
  #notice { color: #db4; margin-bottom: 8px; }
</style>
</head>
<body>
  <div id="sidebar">
    <h2>Tables</h2>
    <ul id="tableList"></ul>
  </div>
  <div id="main">
    <div id="sqlBox">
      <textarea id="sql" placeholder="SELECT * FROM ..."></textarea>
      <button id="run">Run</button>
    </div>
    <div id="status"></div>
    <div id="notice"></div>
    <div id="resultWrap"><table id="result"></table></div>
    <div id="pager"></div>
  </div>

<script>
const LIMIT = 100

// Bumped on every render; a response whose token is stale must not paint over
// a newer one (fast clicking between tables would otherwise cross the streams).
let renderSeq = 0

const $ = (id) => document.getElementById(id)

function currentQuery() {
  return new URLSearchParams(location.search).get('q') ?? ''
}

function queryHref(sql) {
  return '/?q=' + encodeURIComponent(sql)
}

/** SQL literal for a cell value. `quote` comes from the server's fk metadata. */
function sqlLiteral(value, quote) {
  return quote ? "'" + String(value).replaceAll("'", "''") + "'" : String(value)
}

/** Cosmetic only: drives the sidebar highlight, nothing else. */
function tableOfQuery(sql) {
  const m = /\bfrom\s+"?([a-z_][a-z0-9_$]*)"?/i.exec(sql)
  return m ? m[1].toLowerCase() : null
}

const GENERATED_RE = /^select \* from ("?[a-z_][a-z0-9_$]*"?)(?: where (.+?))? limit (\d+) offset (\d+)$/i

/**
 * Recognise the exact shape this app generates, so the pager only ever
 * rewrites SQL we built ourselves. Hand-typed SQL returns null and runs as-is.
 * @returns {{table: string, where: string|null, limit: number, offset: number}|null}
 */
function parseGenerated(sql) {
  const m = GENERATED_RE.exec(sql.trim())
  if (!m) return null
  const [, table, where, limit, offset] = m
  // A parenthesis or `;` in the where clause means this isn't a where clause
  // we generated ourselves (the FK link builder never emits either) - reject
  // so hand-typed SQL can't masquerade as the generated shape and get rewritten.
  if (where && /[();]/.test(where)) return null
  return { table, where: where ? where.trim() : null, limit: Number(limit), offset: Number(offset) }
}

/** Inverse of parseGenerated. */
function buildGenerated({ table, where, limit, offset }) {
  return `select * from ${table}${where ? ' where ' + where : ''} limit ${limit} offset ${offset}`
}

function setActiveTable(name) {
  document.querySelectorAll('#tableList li').forEach((li) => {
    li.classList.toggle('active', li.dataset.table === name)
  })
}

async function loadTables() {
  const tables = await fetch('/api/tables').then((r) => r.json())
  const list = $('tableList')
  list.innerHTML = ''
  tables.forEach((name) => {
    const li = document.createElement('li')
    li.dataset.table = name
    const a = document.createElement('a')
    a.href = queryHref(buildGenerated({ table: name, where: null, limit: LIMIT, offset: 0 }))
    a.textContent = name
    li.appendChild(a)
    list.appendChild(li)
  })
}

function renderRows(rows, fks) {
  const table = $('result')
  table.innerHTML = ''
  if (!rows.length) {
    table.innerHTML = '<tr><td>(no rows)</td></tr>'
    return
  }
  const cols = Object.keys(rows[0])
  const thead = document.createElement('tr')
  cols.forEach((c) => {
    const th = document.createElement('th')
    th.textContent = c
    thead.appendChild(th)
  })
  table.appendChild(thead)
  rows.forEach((row) => {
    const tr = document.createElement('tr')
    cols.forEach((c) => {
      const td = document.createElement('td')
      const fk = fks[c]
      if (fk && row[c] != null) {
        const a = document.createElement('a')
        a.textContent = row[c]
        a.href = queryHref(buildGenerated({
          table: fk.table,
          where: `${fk.column} = ${sqlLiteral(row[c], fk.quote)}`,
          limit: LIMIT,
          offset: 0,
        }))
        td.appendChild(a)
      } else {
        td.textContent = row[c]
      }
      tr.appendChild(td)
    })
    table.appendChild(tr)
  })
}

function renderPager(query, rowCount, hasNext) {
  const pager = $('pager')
  pager.innerHTML = ''
  const gen = parseGenerated(query)
  if (!gen) return
  const span = document.createElement('span')
  span.textContent = rowCount === 0 ? '0-0' : `${gen.offset + 1}-${gen.offset + rowCount}`
  pager.appendChild(span)
  if (gen.offset > 0) {
    const prev = document.createElement('a')
    prev.textContent = 'Prev'
    prev.href = queryHref(buildGenerated({ ...gen, offset: Math.max(0, gen.offset - gen.limit) }))
    pager.appendChild(prev)
  }
  if (hasNext) {
    const next = document.createElement('a')
    next.textContent = 'Next'
    next.href = queryHref(buildGenerated({ ...gen, offset: gen.offset + gen.limit }))
    pager.appendChild(next)
  }
}

function clearMain() {
  $('status').textContent = ''
  $('notice').textContent = ''
  $('result').innerHTML = ''
  $('pager').innerHTML = ''
}

/** Paint a response. Shared by the URL path and the Run button. */
function paint(query, res, gen) {
  clearMain()
  if (res.error) {
    $('status').textContent = res.error
    return
  }
  const all = res.rows ?? []
  const shown = gen ? all.slice(0, gen.limit) : all
  renderRows(shown, res.fks ?? {})
  if (res.truncated) {
    $('notice').textContent = `Showing the first ${shown.length} rows; the result was truncated.`
  }
  renderPager(query, shown.length, gen ? all.length > gen.limit : false)
}

/** Reflect a query in the chrome: textarea, placeholder, sidebar highlight. */
function showQuery(query) {
  $('sql').value = ''
  $('sql').placeholder = query || 'SELECT * FROM ...'
  setActiveTable(tableOfQuery(query))
}

/** Execute a query read-only and paint. Never writes history. */
async function render(query) {
  const seq = ++renderSeq
  showQuery(query)

  if (!query.trim()) {
    clearMain()
    return
  }

  const gen = parseGenerated(query)
  // limit+1 tells us whether a next page exists, without a COUNT(*).
  const sent = gen ? buildGenerated({ ...gen, limit: gen.limit + 1 }) : query

  const res = await fetch('/api/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql: sent, readOnly: true }),
  }).then((r) => r.json())

  if (seq !== renderSeq) return
  paint(query, res, gen)
}

function navigate(query) {
  if (query !== currentQuery()) {
    history.pushState({ q: query }, '', queryHref(query))
  }
  render(query)
}

// One delegated handler for every navigable affordance. Modifier and
// non-primary clicks fall through so the browser can open a new tab.
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="/?q="]')
  if (!a) return
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
  e.preventDefault()
  navigate(new URL(a.href).searchParams.get('q') ?? '')
})

window.addEventListener('popstate', () => render(currentQuery()))

/** The Run button is the only path that may write. Writes never enter the URL. */
async function runQuery() {
  const sql = $('sql').value.trim()
  if (!sql) return
  const seq = ++renderSeq
  const res = await fetch('/api/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql, readOnly: false }),
  }).then((r) => r.json())
  if (seq !== renderSeq) return

  if (res.rows) {
    // A read: make it bookmarkable. Painted from this response rather than
    // via navigate(), which would execute the same SELECT a second time.
    if (sql !== currentQuery()) history.pushState({ q: sql }, '', queryHref(sql))
    showQuery(sql)
    paint(sql, res, parseGenerated(sql))
    return
  }
  clearMain()
  if (res.error) {
    $('status').textContent = res.error
  } else {
    $('status').textContent = `OK: ${res.changes} row(s) changed`
  }
}

$('run').onclick = runQuery
$('sql').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault()
    runQuery()
  }
})

loadTables().then(() => render(currentQuery()))
</script>
</body>
</html>
