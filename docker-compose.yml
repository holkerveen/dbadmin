name: dbadmin

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbadmin}
    ports:
      - '${DB_HOST_PORT:-55432}:5432'
    volumes:
      - dbadmin-db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dbadmin}']
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build:
      context: .
      target: dev
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbadmin}
      DB_ADMIN_PORT: ${DB_ADMIN_PORT:-80}
    ports:
      - '${APP_HOST_PORT:-8080}:80'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbadmin-db-data:
