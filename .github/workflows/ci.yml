name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Not ./dbadmin.sh setup -- that runs `npm install`, which can drift the lockfile.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run lint

      - run: npm run typecheck

      # Self-contained: builds both the dev and prod stacks, waits on /healthz,
      # applies db/schema.sql, seeds, runs the specs, tears down with `down -v`.
      # The test compose files carry throwaway credentials, so no .env is needed.
      - run: ./dbadmin.sh test

  # Deliberately no job-level `if`: a skipped job propagates its skip through
  # the whole downstream `needs` graph, which would silently skip `merge` too.
  # Gating the step instead makes this a no-op success on non-tag pushes.
  assert-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: package.json version must match the git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(npm pkg get version | tr -d '"')
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME expects package.json version $tag, found $pkg"
            exit 1
          fi
          echo "package.json version $pkg matches tag $GITHUB_REF_NAME"

  build:
    needs: [test, assert-version]
    # PRs from forks get a read-only token, so there is nothing to push to.
    # This skip intentionally cascades to `merge`.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Free for public repositories; billed minutes if this repo goes private.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here -- tags come from the merge job, since
      # these builds push by digest. Without org.opencontainers.image.source
      # the GHCR package is never linked to this repo and no Packages link
      # appears in the repo sidebar.
      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestation is done once against the merged manifest instead;
          # inline provenance adds manifest entries that confuse imagetools create.
          provenance: false
          # Per-platform scope: a shared one makes the two jobs clobber each other.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # latest=auto applies `latest` only for a valid semver git tag, so
          # `latest` means newest release rather than newest main commit.
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Array form keeps annotation values with spaces (descriptions, dates) intact.
          annotations=()
          while IFS= read -r a; do
            [ -n "$a" ] && annotations+=(--annotation "index:$a")
          done <<< "$DOCKER_METADATA_OUTPUT_ANNOTATIONS"
          docker buildx imagetools create "${annotations[@]}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect and capture digest
        id: inspect
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}"
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  # Creates the GitHub Release entry (changelog page, source tarballs, watcher
  # notification). Runs only after `merge`, so a Release never exists for a tag
  # whose image failed to publish.
  release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Container image

            ```sh
            docker pull ${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }}
            ```

            Multi-arch (`linux/amd64`, `linux/arm64`), digest `${{ needs.merge.outputs.digest }}`.

            Pin `${{ env.REGISTRY_IMAGE }}@${{ needs.merge.outputs.digest }}` for an immutable reference.
