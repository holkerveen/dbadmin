name: dbadmin-test-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dbadmin
    ports:
      - '55434:5432'
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dbadmin']
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  app:
    build:
      context: .
      target: prod
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dbadmin
      DB_ADMIN_PORT: 80
    ports:
      - '8082:80'
    depends_on:
      db:
        condition: service_healthy
